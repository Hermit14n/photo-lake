[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
photolake-core = { path = "crates/core" }
photolake-lake = { path = "crates/lake" }
photolake-ingest = { path = "crates/ingest" }
photolake-ml = { path = "crates/ml" }
photolake-backup = { path = "crates/backup" }
photolake-server = { path = "crates/server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
iceberg = "0.10"
iceberg-storage-opendal = "0.10"
iceberg-catalog-sql = "0.10"
iceberg-datafusion = "0.10"
datafusion = "53.1"
opendal = { version = "0.57", features = ["services-s3"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "any", "runtime-tokio"] }
rusty-s3 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
directories = "6"
bytes = "1"
url = "2"
async-trait = "0.1"
