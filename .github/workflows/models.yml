# Build the bird-model image when the export script changes (or on demand).
name: Models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/export_models.py", "docker/models.Dockerfile", "docker/install-models.sh"]

permissions:
  contents: read
  packages: write

jobs:
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for torch
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Model version
        id: v
        run: echo "version=$(grep -o 'rtdetr_r50vd+bioclip2/[0-9]*' tools/export_models.py | head -1 | tr '+/' '--')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/models.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/photolake-models:latest
            ghcr.io/${{ github.repository_owner }}/photolake-models:${{ steps.v.outputs.version }}
